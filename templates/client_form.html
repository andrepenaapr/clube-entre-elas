{% extends "base.html" %}
{% block title %}{{ 'Editar cliente' if client else 'Novo cliente' }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'Editar cliente' if client else 'Novo cliente' }}</h4>
<div class="card p-4" style="max-width: 700px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Nome completo *</label>
      <input type="text" class="form-control" name="name" value="{{ client.name if client else '' }}" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">CPF/CNPJ</label>
        <input type="text" class="form-control" name="document" value="{{ client.document if client else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" name="phone" value="{{ client.phone if client else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" name="email" value="{{ client.email if client else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Endereço</label>
      <input type="text" class="form-control" name="address" value="{{ client.address if client else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Observações</label>
      <textarea class="form-control" name="notes" rows="2">{{ client.notes if client else '' }}</textarea>
    </div>
    {% if client %}
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="active" id="active" {% if client.active %}checked{% endif %}>
      <label class="form-check-label" for="active">Cliente ativo</label>
    </div>
    {% endif %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-dark">Salvar</button>
      <a href="{{ url_for('clients_list') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
